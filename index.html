<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCENT Streetwear</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d0d0d;
color:white;
}

header{
padding:25px;
text-align:center;
background:black;
border-bottom:2px solid #c40000;
}

header h1{
font-size:42px;
letter-spacing:4px;
}

header p{
color:#aaa;
margin-top:8px;
}

.hero{
height:90vh;
background:url("https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=1600&q=80") center/cover;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.overlay{
background:rgba(0,0,0,.65);
padding:50px;
}

.overlay h2{
font-size:60px;
margin-bottom:15px;
}

.overlay p{
font-size:20px;
color:#ddd;
margin-bottom:25px;
}

button{
padding:15px 35px;
background:#c40000;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

.products{
padding:70px 10%;
}

.products h2{
text-align:center;
margin-bottom:40px;
font-size:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:#181818;
padding:20px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
border-radius:8px;
}

.card h3{
margin:20px 0 10px;
}

.price{
color:#ff4040;
font-size:22px;
font-weight:bold;
}

footer{
padding:30px;
text-align:center;
background:black;
margin-top:50px;
color:#777;
}
</style>

</head>

<body>

<header>
<h1>ASCENT</h1>
<p>FROM GROUND UP • RISE ABOVE</p>
</header>

<section class="hero">
<div class="overlay">
<h2>FIRST DROP</h2>
<p>More than clothing. It's a mindset.</p>
<button>SHOP NOW</button>
</div>
</section>

<section class="products">

<h2>Featured Collection</h2>

<div class="grid">

<div class="card">
<img src="https://via.placeholder.com/500x600?text=ASCENT+TEE" alt="">
<h3>ASCENT Front Logo Tee</h3>
<p class="price">₱550</p>
</div>

<div class="card">
<img src="https://via.placeholder.com/500x600?text=RISING+STARS" alt="">
<h3>Rising Stars Tee</h3>
<p class="price">₱550</p>
</div>

</div>

</section>

<footer>
© 2026 ASCENT STREETWEAR
</footer>

</body>
</html>
